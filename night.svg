<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#05060f"/>
      <stop offset="40%" stop-color="#0a0d24"/>
      <stop offset="70%" stop-color="#12123a"/>
      <stop offset="100%" stop-color="#1e1646"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="rgba(245,240,205,0.45)"/>
      <stop offset="55%" stop-color="rgba(245,240,205,0.14)"/>
      <stop offset="100%" stop-color="rgba(245,240,205,0)"/>
    </radialGradient>
    <radialGradient id="flowerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="70%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(60,66,120,0)"/>
      <stop offset="100%" stop-color="rgba(60,66,120,0.40)"/>
    </linearGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="rgba(230,232,205,0.18)"/>
      <stop offset="100%" stop-color="rgba(230,232,205,0)"/>
    </radialGradient>
    <radialGradient id="fireflyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="rgba(216,255,150,0.55)"/>
      <stop offset="100%" stop-color="rgba(216,255,150,0)"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#f5f0cd">
    <rect x="60"  y="24" width="6" height="6"/>
    <rect x="180" y="46" width="6" height="6"/>
    <rect x="340" y="20" width="6" height="6"/>
    <rect x="500" y="36" width="6" height="6"/>
    <rect x="600" y="18" width="6" height="6"/>
  </g>
  <g fill="#c7cdf2">
    <rect x="110" y="60" width="4" height="4"/>
    <rect x="260" y="34" width="4" height="4"/>
    <rect x="380" y="58" width="4" height="4"/>
    <rect x="450" y="16" width="4" height="4"/>
    <rect x="560" y="52" width="4" height="4"/>
    <rect x="30"  y="46" width="4" height="4"/>
  </g>
  <g fill="#3d4270">
    <rect x="150" y="16" width="4" height="4"/>
    <rect x="230" y="66" width="4" height="4"/>
    <rect x="410" y="42" width="4" height="4"/>
    <rect x="530" y="70" width="4" height="4"/>
    <rect x="90"  y="34" width="4" height="4"/>
  </g>

  <!-- sparkle stars -->
  <g fill="#fff7d6">
    <rect x="338" y="12" width="4" height="20"/>
    <rect x="330" y="20" width="20" height="4"/>
    <rect x="600" y="10" width="4" height="18"/>
    <rect x="592" y="17" width="20" height="4"/>
  </g>

  <!-- shooting star -->
  <g fill="#ffffff">
    <rect x="90"  y="28" width="6" height="6" fill-opacity="0.9"/>
    <rect x="100" y="36" width="5" height="5" fill-opacity="0.6"/>
    <rect x="109" y="44" width="4" height="4" fill-opacity="0.35"/>
    <rect x="117" y="51" width="3" height="3" fill-opacity="0.18"/>
  </g>

  <!-- moon -->
  <circle cx="650" cy="46" r="70" fill="url(#moonGlow)"/>
  <g fill="#f2eecb">
    <rect x="632" y="10" width="36" height="8"/>
    <rect x="624" y="18" width="52" height="8"/>
    <rect x="616" y="26" width="68" height="8"/>
    <rect x="616" y="34" width="68" height="8"/>
    <rect x="616" y="42" width="68" height="8"/>
    <rect x="624" y="50" width="52" height="8"/>
    <rect x="632" y="58" width="36" height="8"/>
  </g>
  <g fill="#e6e1b8" fill-opacity="0.5">
    <rect x="656" y="50" width="20" height="8"/>
    <rect x="648" y="58" width="20" height="8"/>
  </g>
  <g fill="#dcd6a8">
    <rect x="640" y="26" width="12" height="8"/>
    <rect x="628" y="42" width="12" height="8"/>
    <rect x="656" y="34" width="10" height="8"/>
  </g>

  <!-- horizon haze -->
  <rect x="0" y="120" width="800" height="56" fill="url(#haze)"/>

  <!-- ground -->
  <rect x="0" y="182" width="800" height="18" fill="#04050c"/>

  <!-- soft hill silhouette -->
  <rect x="0"   y="176" width="800" height="6" fill="#0a0c24"/>
  <rect x="120" y="170" width="220" height="6" fill="#0a0c24"/>
  <rect x="480" y="172" width="260" height="6" fill="#0a0c24"/>

  <!-- moonlight pool on ground -->
  <ellipse cx="650" cy="184" rx="150" ry="16" fill="url(#pool)"/>

  <!-- grass tufts -->
  <g fill="#2f4d33">
    <rect x="176" y="174" width="4" height="8"/>
    <rect x="184" y="172" width="4" height="10"/>
    <rect x="206" y="173" width="4" height="9"/>
    <rect x="214" y="176" width="4" height="6"/>
    <rect x="112" y="175" width="3" height="7"/>
    <rect x="134" y="174" width="4" height="8"/>
    <rect x="250" y="175" width="4" height="7"/>
    <rect x="278" y="174" width="4" height="8"/>
    <rect x="40"  y="176" width="3" height="6"/>
    <rect x="360" y="176" width="3" height="6"/>
    <rect x="520" y="175" width="3" height="7"/>
    <rect x="700" y="176" width="3" height="6"/>
  </g>
  <g fill="#3d6640">
    <rect x="180" y="176" width="3" height="6"/>
    <rect x="200" y="176" width="3" height="6"/>
    <rect x="210" y="177" width="3" height="5"/>
    <rect x="120" y="177" width="3" height="5"/>
    <rect x="128" y="176" width="3" height="6"/>
    <rect x="258" y="177" width="3" height="5"/>
    <rect x="270" y="176" width="3" height="6"/>
  </g>

  <!-- chamomile flower cluster -->
  <g>
    <circle cx="195" cy="128" r="46" fill="url(#flowerGlow)"/>

    <!-- stems + leaves -->
    <rect x="192" y="150" width="6" height="34" fill="#3f6a41"/>
    <rect x="264" y="158" width="5" height="26" fill="#385f3c"/>
    <rect x="128" y="158" width="5" height="26" fill="#385f3c"/>
    <rect x="184" y="164" width="8" height="6" fill="#4a7a4c"/>
    <rect x="198" y="170" width="8" height="6" fill="#4a7a4c"/>

    <!-- large chamomile petals -->
    <g fill="#f4f6ff">
      <rect x="185" y="98"  width="20" height="10"/>
      <rect x="185" y="128" width="20" height="10"/>
      <rect x="170" y="113" width="10" height="20"/>
      <rect x="210" y="113" width="10" height="20"/>
      <rect x="176" y="103" width="10" height="10"/>
      <rect x="204" y="103" width="10" height="10"/>
      <rect x="176" y="123" width="10" height="10"/>
      <rect x="204" y="123" width="10" height="10"/>
      <!-- pointed tips -->
      <rect x="190" y="94"  width="10" height="4"/>
      <rect x="190" y="138" width="10" height="4"/>
      <rect x="164" y="118" width="6"  height="10"/>
      <rect x="220" y="118" width="6"  height="10"/>
    </g>
    <!-- petal shading + highlight -->
    <g fill="#d7dcf0" fill-opacity="0.6">
      <rect x="185" y="132" width="20" height="6"/>
      <rect x="204" y="123" width="10" height="10"/>
    </g>
    <rect x="176" y="98" width="14" height="5" fill="#ffffff"/>
    <!-- yellow core -->
    <rect x="182" y="112" width="16" height="16" fill="#f0c94f"/>
    <rect x="182" y="112" width="7"  height="7"  fill="#f8dd82"/>
    <rect x="191" y="121" width="7"  height="7"  fill="#d9a83a"/>

    <!-- small chamomile (right) -->
    <g fill="#e9ecfb">
      <rect x="256" y="132" width="14" height="7"/>
      <rect x="256" y="150" width="14" height="7"/>
      <rect x="246" y="141" width="7" height="14"/>
      <rect x="270" y="141" width="7" height="14"/>
    </g>
    <rect x="255" y="141" width="10" height="10" fill="#e8b93f"/>

    <!-- small chamomile (left) -->
    <g fill="#e9ecfb">
      <rect x="118" y="132" width="14" height="7"/>
      <rect x="118" y="150" width="14" height="7"/>
      <rect x="108" y="141" width="7" height="14"/>
      <rect x="132" y="141" width="7" height="14"/>
    </g>
    <rect x="117" y="141" width="10" height="10" fill="#e8b93f"/>
  </g>

  <!-- fireflies (foreground) -->
  <g>
    <circle cx="300" cy="150" r="9" fill="url(#fireflyGlow)"/>
    <rect x="298" y="148" width="4" height="4" fill="#eaffb0"/>
    <circle cx="70"  cy="120" r="8" fill="url(#fireflyGlow)"/>
    <rect x="68" y="118" width="4" height="4" fill="#eaffb0"/>
    <circle cx="430" cy="135" r="8" fill="url(#fireflyGlow)"/>
    <rect x="428" y="133" width="3" height="3" fill="#d8ff9a"/>
    <circle cx="150" cy="90"  r="7" fill="url(#fireflyGlow)"/>
    <rect x="149" y="89" width="3" height="3" fill="#d8ff9a"/>
    <circle cx="360" cy="110" r="7" fill="url(#fireflyGlow)"/>
    <rect x="359" y="109" width="3" height="3" fill="#eaffb0"/>
  </g>
</svg>
